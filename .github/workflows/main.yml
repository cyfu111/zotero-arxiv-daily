name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
    # Retry infrastructure/SMTP failures; the daily ledger prevents a second accepted digest.
    - cron: '47 23 * * *'

permissions:
  contents: read

concurrency:
  group: daily-digest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-daily.txt

      - name: Restore delivery ledger
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: daily-ledger-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-ledger-${{ github.ref_name }}-

      - name: Install daily dependencies
        continue-on-error: true
        timeout-minutes: 4
        run: python -m pip install --timeout 30 --retries 3 -r requirements-daily.txt

      - name: Install optional embedding ranker
        if: vars.RANKING != 'lexical'
        continue-on-error: true
        timeout-minutes: 5
        run: python -m pip install --timeout 20 --retries 1 'sentence-transformers>=3.3.1,<6'

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY || 'true' }}
          JOURNAL_QUERIES: ${{ vars.JOURNAL_QUERIES }}
          JOURNAL_ISSNS: ${{ vars.JOURNAL_ISSNS }}
          JOURNAL_FEEDS: ${{ vars.JOURNAL_FEEDS }}
          JOURNAL_MAX_AGE_DAYS: ${{ vars.JOURNAL_MAX_AGE_DAYS }}
          LOOKBACK_DAYS: ${{ vars.LOOKBACK_DAYS }}
          SOURCE_MAX_RESULTS: ${{ vars.SOURCE_MAX_RESULTS }}
          SOURCES: ${{ vars.SOURCES }}
          RANKING: ${{ vars.RANKING }}
          ENRICH_SUMMARIES: ${{ vars.ENRICH_SUMMARIES }}
          HF_HUB_DOWNLOAD_TIMEOUT: '30'
          HF_HUB_ETAG_TIMEOUT: '30'
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
        run: |
          python main.py

      - name: Save delivery ledger (including uncertain delivery guard)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: daily-ledger-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
