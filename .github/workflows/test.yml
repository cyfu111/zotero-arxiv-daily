name: Offline reliability tests
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py digest.py construct_email.py recommender.py llm.py
